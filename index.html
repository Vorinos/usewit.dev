<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wit</title>
<meta name="description" content="Wit reads your notes and AI chats on your own computer, files them, links them, and draws the whole record as a map you can turn, zoom into and search.">

<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#040405}
body{color:#fff;font-family:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
a{color:#fff}
.page{position:relative;min-height:100vh;min-height:100svh;overflow:hidden;display:flex;flex-direction:column}
.layer{position:absolute;inset:0;pointer-events:none}
.spot{background:radial-gradient(ellipse 520px 280px at 50% -60px,rgba(255,255,255,.06) 0%,rgba(255,255,255,0) 100%)}
#art{width:100%;height:100%;display:block;animation:fade 2s ease both}
.veil{background:radial-gradient(ellipse 400px 165px at 50% calc(50% - 22px),rgba(4,4,5,.62) 0%,rgba(4,4,5,0) 100%),linear-gradient(180deg,rgba(4,4,5,0) 78%,rgba(4,4,5,.7) 100%)}
.grain{background-image:url(/assets/grain.png);background-size:200px 200px;opacity:.035}
.home{position:absolute;z-index:2;top:22px;left:50%;transform:translateX(-50%);display:flex;color:#fff}
main{position:relative;z-index:1;flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:96px 24px 150px;text-align:center}
h1{margin:0;font-size:28px;line-height:1.25;font-weight:500;letter-spacing:-.025em;text-wrap:balance;background:linear-gradient(90deg,#fff 0%,#fff 48%,rgba(255,255,255,.52) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.btns{margin-top:26px;display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.btn{position:relative;z-index:1;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 18px;border-radius:999px;font-size:14px;font-weight:500;text-decoration:none;background:#010008;color:#dfd8e6;transition:background .15s ease,color .15s ease}
.btn:hover{background:#0a0812;color:#fff}
.btn.primary{background:#fff;color:#0a0a0a}
.btn.primary:hover{background:#ececec;color:#0a0a0a}
/* the glow: light running round each button's edge, in four layers (wide and soft under the button, near and sharp over
   its edge), screened over what is behind. The light itself is the film in assets/light-map.png */
.glow{position:relative;display:inline-flex;border-radius:999px}
[data-glow] canvas{position:absolute;pointer-events:none;mix-blend-mode:screen}
[data-glow] canvas.lo{z-index:0}[data-glow] canvas.hi{z-index:2}
.home svg{position:relative;z-index:1}
.note{margin:14px 0 0;max-width:420px;font-size:12.5px;line-height:1.5;color:rgba(255,255,255,.58);text-wrap:balance}
.apps{list-style:none;margin:30px 0 0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:16px}
.apps li{display:flex}
.apps img{display:block;width:18px;height:18px;opacity:.55;transition:opacity .2s ease}
.apps li:hover img{opacity:.95}
.foot{position:absolute;z-index:1;left:0;right:0;bottom:34px;padding:0 24px;display:flex;flex-direction:column;align-items:center;gap:12px}
.cap{margin:0;font-size:10.5px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.plats{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 22px}
.plats a{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:rgba(255,255,255,.8);text-decoration:none;transition:color .15s ease}
.plats a:hover{color:#fff}
a:focus-visible{outline:2px solid #fff;outline-offset:3px}
.rise{animation:rise 1s cubic-bezier(.2,.7,.2,1) both}.d1{animation-delay:.12s}.d2{animation-delay:.24s}.d3{animation-delay:.36s}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#art,.rise{animation:none}}
</style>
</head>
<body>
<div class="page">
<div class="layer spot" aria-hidden="true"></div>
<div class="layer" aria-hidden="true"><canvas id="art"></canvas></div>
<div class="layer veil" aria-hidden="true"></div>
<div class="layer grain" aria-hidden="true"></div>

<a href="/" class="home" aria-label="Wit">
<img src="/assets/mark-film.png" alt="" width="30" height="30">
</a>

<main>
<h1 class="rise">A second brain for your notes and AI chats</h1>
<div class="btns rise d1" style="gap:14px">
<span class="glow" data-glow="pill" data-strength="1" data-offset="0"><canvas class="lo" aria-hidden="true"></canvas><canvas class="lo" aria-hidden="true"></canvas><a class="btn primary" id="dl" href="https://github.com/Vorinos/Wit/releases/latest/download/Wit-arm64.dmg" data-os="mac">

<span id="dlLabel">Download for Mac</span>
</a><canvas class="hi" aria-hidden="true"></canvas><canvas class="hi" aria-hidden="true"></canvas></span>
<span class="glow" data-glow="pill" data-strength="0.62" data-offset="0.37"><canvas class="lo" aria-hidden="true"></canvas><canvas class="lo" aria-hidden="true"></canvas><a class="btn" href="https://github.com/Vorinos/Wit">
<svg width="14" height="14" viewBox="0 0 24 24" fill="#F5B83D" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/></svg>
Star on GitHub

<span class="glow" data-glow="pill" data-strength="0.62" data-offset="0.71"><canvas class="lo" aria-hidden="true"></canvas><canvas class="lo" aria-hidden="true"></canvas><a class="btn" href="/app/">
Open in browser
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>
</a><canvas class="hi" aria-hidden="true"></canvas><canvas class="hi" aria-hidden="true"></canvas></span>
</div>
<p class="note rise d2" id="note" aria-live="polite">Rather not download anything? Open it in your browser. Your notes stay on your device, and it installs as an app from the address bar.</p>
<ul class="apps rise d3" aria-label="Works with">
<li title="Claude Desktop and Claude Code"><img src="/assets/glyph-claude.png" alt="Claude" width="18" height="18"></li>

</ul>
</main>

<script>
/* The Download button offers the file for the visitor's own computer, and after a click says what to expect the first
   time it opens. The files keep the same names in every release, so these links always fetch the newest. */
(function () {
  var REL = 'https://github.com/Vorinos/Wit/releases/latest/download/';
  var ua = navigator.userAgent, plat = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || '';
  var dl = document.getElementById('dl'), label = document.getElementById('dlLabel'), note = document.getElementById('note');
  var phone = /iPhone|iPad|iPod|Android/i.test(ua) || (/Mac/.test(plat) && navigator.maxTouchPoints > 1);
  if (!phone && /Win/i.test(plat)) { dl.href = REL + 'Wit-Setup.exe'; dl.dataset.os = 'win'; label.textContent = 'Download for Windows'; }
  else if (!phone && /Linux|X11/i.test(plat + ua) && !/Android|CrOS/i.test(ua)) { dl.href = REL + 'Wit.AppImage'; dl.dataset.os = 'linux'; label.textContent = 'Download for Linux'; }
  else if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues && /mac/i.test(plat)) {
    navigator.userAgentData.getHighEntropyValues(['architecture']).then(function (v) { if (v.architecture === 'x86') dl.href = REL + 'Wit-x64.dmg'; }).catch(function () {});
  }
  var FIRST = {
    mac: 'Downloading. The first time you open Wit, macOS will ask: go to System Settings \u203a Privacy & Security and click Open Anyway. Wit is not notarized by Apple yet.',
    win: 'Downloading. If Windows SmartScreen appears when you run it, click More info, then Run anyway.',
    linux: 'Downloading. Make the file executable (chmod +x Wit.AppImage), then run it.'
  };
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[data-os]');
    if (a && FIRST[a.dataset.os]) note.textContent = FIRST[a.dataset.os];
  });
})();
</script>

<script>
/* The glow round the buttons. The light map is a film of the light: one column per point round the ring
   (720), one row per 1/30 s of one turn (150 rows = 5 s). Each frame reads the two rows round the light's phase, blends
   them, and strokes the ring (a button's edge) in short pieces of those colours. That sharp
   ring is copied into four layers, which CSS blurs and screens over the page. */
(function () {
  var items = [].slice.call(document.querySelectorAll('[data-glow]'));
  if (!items.length) return;
  var reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  var N = 240, CYCLE = 10;                                                  // one turn of the light, in seconds (the film's own pace is 5)
  var LAYERS = [{ blur: 11, alpha: 0.93, rise: 2 }, { blur: 4.5, alpha: 0.91, rise: 0 }, { blur: 1, alpha: 0.98, rise: 0 }, { blur: 0, alpha: 0.29, rise: 0 }];
  var SHAPES = { pill: { m: 40, scale: 1, core: 2.2 }, mark: { m: 30, scale: 0.7, core: 1.3 } };

  function pillPoint(u, x, y, w, h, r) {
    var a = w - 2 * r, b = h - 2 * r, q = Math.PI * r / 2, d = (((u % 1) + 1) % 1) * (2 * a + 2 * b + 4 * q), parts = [a, q, b, q, a, q, b, q];
    for (var k = 0; k < 8; k++) {
      if (d <= parts[k]) {
        if (k === 0) return [x + r + d, y];
        if (k === 2) return [x + w, y + r + d];
        if (k === 4) return [x + w - r - d, y + h];
        if (k === 6) return [x, y + h - r - d];
        var j = (k - 1) / 2, cx = j < 2 ? x + w - r : x + r, cy = j === 0 || j === 3 ? y + r : y + h - r, ang = -Math.PI / 2 + j * Math.PI / 2 + d / r;
        return [cx + r * Math.cos(ang), cy + r * Math.sin(ang)];
      }
      d -= parts[k];
    }
    return [x + r, y];
  }

  var rings = items.map(function (el) {
    var shape = SHAPES[el.getAttribute('data-glow')] || SHAPES.pill, strength = parseFloat(el.getAttribute('data-strength') || '1');
    var cvs = [].slice.call(el.querySelectorAll(':scope > canvas')), target = shape === SHAPES.mark ? el.querySelector('svg') : el.querySelector('.btn');
    cvs.forEach(function (c, k) {
      var L = LAYERS[k], bl = L.blur * shape.scale;
      c.style.filter = bl ? 'blur(' + bl + 'px)' : 'none';
      c.style.opacity = String(Math.min(1, L.alpha * strength));
      c.style.left = (-shape.m) + 'px'; c.style.top = (-shape.m - L.rise * shape.scale) + 'px';
    });
    var sharp = document.createElement('canvas');
    return { el: el, shape: shape, target: target, cvs: cvs, ctx: cvs.map(function (c) { return c.getContext('2d'); }), sharp: sharp, sg: sharp.getContext('2d'), off: parseFloat(el.getAttribute('data-offset') || '0'), ends: null, w: 0, h: 0, dpr: 1 };
  });

  function layout(R) {
    var t = R.target; if (!t) return;
    var w = t.getBoundingClientRect ? t.clientWidth || t.getBoundingClientRect().width : 0, h = t.clientHeight || t.getBoundingClientRect().height, M = R.shape.m, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!w || !h) return;
    R.w = w; R.h = h; R.dpr = dpr;
    var W = w + 2 * M, H = h + 2 * M;
    [R.sharp].concat(R.cvs).forEach(function (c) { c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); c.style.width = W + 'px'; c.style.height = H + 'px'; });
    var pt;
    if (R.shape === SHAPES.mark) {
      /* the mark's outline, measured by length along the path in the SVG, mapped from its viewBox into the layer */
      var path = t.querySelector('path'), vb = t.viewBox.baseVal, total = path.getTotalLength(), sx = w / vb.width, sy = h / vb.height;
      pt = function (u) { var q = path.getPointAtLength((((u % 1) + 1) % 1) * total); return [M + (q.x - vb.x) * sx, M + (q.y - vb.y) * sy]; };
    } else {
      var rx = M - 0.6, ry = M - 0.6, rw = w + 1.2, rh = h + 1.2;
      pt = function (u) { return pillPoint(u, rx, ry, rw, rh, rh / 2); };
    }
    R.ends = [];
    for (var i = 0; i < N; i++) R.ends.push([pt((i - 0.75) / N), pt((i + 0.75) / N)]);
  }

  function start(map) {
    var cols = map.width, rows = map.height, d = map.data;
    rings.forEach(layout);
    function paint(R, phase) {
      if (!R.ends) return;
      var g = R.sg, M = R.shape.m, f = phase * rows, r0 = Math.floor(f) % rows, r1 = (r0 + 1) % rows, k = f - Math.floor(f);
      g.setTransform(R.dpr, 0, 0, R.dpr, 0, 0); g.clearRect(0, 0, R.w + 2 * M, R.h + 2 * M);
      g.lineWidth = R.shape.core; g.lineCap = 'butt';
      for (var i = 0; i < N; i++) {
        var col = Math.floor(i * cols / N), a = (r0 * cols + col) * 4, b = (r1 * cols + col) * 4;
        var rr = d[a] + (d[b] - d[a]) * k, gg = d[a + 1] + (d[b + 1] - d[a + 1]) * k, bb = d[a + 2] + (d[b + 2] - d[a + 2]) * k;
        if (rr + gg + bb < 6) continue;
        var e = R.ends[i];
        g.strokeStyle = 'rgb(' + rr.toFixed(1) + ',' + gg.toFixed(1) + ',' + bb.toFixed(1) + ')';
        g.beginPath(); g.moveTo(e[0][0], e[0][1]); g.lineTo(e[1][0], e[1][1]); g.stroke();
      }
      for (var j = 0; j < R.ctx.length; j++) { var c = R.ctx[j]; c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, c.canvas.width, c.canvas.height); c.drawImage(R.sharp, 0, 0); }
    }
    function render(t) { for (var i = 0; i < rings.length; i++) { var p = (t / CYCLE + rings[i].off) % 1; paint(rings[i], p < 0 ? p + 1 : p); } }
    if (window.ResizeObserver) { var ro = new ResizeObserver(function () { rings.forEach(layout); if (reduce) render(1.2); }); rings.forEach(function (R) { if (R.target) ro.observe(R.target); }); }
    else window.addEventListener('resize', function () { rings.forEach(layout); });
    if (reduce) { render(1.2); return; }
    var t0 = performance.now();
    (function tick(now) { if (!document.hidden) render((now - t0) / 1000); requestAnimationFrame(tick); })(t0);
  }

  var img = new Image();
  img.onload = function () {
    var c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
    var g = c.getContext('2d'); g.drawImage(img, 0, 0);
    var data; try { data = g.getImageData(0, 0, c.width, c.height).data; } catch (e) { return; }
    start({ width: c.width, height: c.height, data: data });
  };
  img.src = '/assets/light-map.png';
})();
</script>
