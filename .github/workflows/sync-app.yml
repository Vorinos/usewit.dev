# Keeps usewit.dev/app the same as the app in Vorinos/Wit.
# Runs every 6 hours, and on demand from the Actions tab ("Run workflow").
name: Sync web app

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy the latest app page
        run: |
          curl -fsSL https://raw.githubusercontent.com/Vorinos/Wit/main/app/index.html -o /tmp/app.html
          python3 tools/inject.py /tmp/app.html app/index.html
      - name: Commit if it changed
        run: |
          if git diff --quiet; then echo "Already up to date."; exit 0; fi
          git config user.name "wit-sync"
          git config user.email "wit-sync@users.noreply.github.com"
          git add app/index.html
          git commit -m "Sync app from Vorinos/Wit"
          git push
